name: Build Bar2 MSSQL Destination

on:
  workflow_dispatch:
  push:
    branches:
      - bar2/mssql-utf8-collation-fix
    paths:
      - "airbyte-integrations/connectors/destination-mssql/**"
      - ".github/workflows/build-mssql-destination.yml"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: bar2admin/destination-mssql-bar2

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build connector
        run: |
          ./gradlew :airbyte-integrations:connectors:destination-mssql:build \
            -x :airbyte-integrations:connectors:destination-mssql:integrationTestJava

      - name: Build Airbyte Docker image
        run: |
          ./gradlew :airbyte-integrations:connectors:destination-mssql:dockerBuildx

      - name: Show local Docker images
        run: |
          docker images | grep -i mssql || true

      - name: Tag custom MSSQL image
        run: |
          docker tag \
            airbyte/destination-mssql:dev \
            ghcr.io/bar2admin/destination-mssql-bar2:bar2-1

      - name: Push custom MSSQL image
        run: |
          docker push ghcr.io/bar2admin/destination-mssql-bar2:bar2-1