name: Build Bar2 MSSQL Destination

on:
  workflow_dispatch:
  push:
    branches:
      - bar2/mssql-utf8-collation-fix
    paths:
      - "airbyte-integrations/connectors/destination-mssql/**"
      - ".github/workflows/build-mssql-destination.yml"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: bar2admin/destination-mssql-bar2

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build connector
        run: |
          ./gradlew :airbyte-integrations:connectors:destination-mssql:build \
            -x :airbyte-integrations:connectors:destination-mssql:integrationTestJava

      - name: Show MSSQL Docker tasks
        run: |
          ./gradlew :airbyte-integrations:connectors:destination-mssql:tasks --all | grep -i docker

      - name: Docker build placeholder
        run: |
          echo "Connector compiled successfully."
          echo "Waiting to identify the correct Airbyte Docker Gradle task."

      - name: GHCR target
        run: |
          echo "Target image will be:"
          echo "${REGISTRY}/${IMAGE_NAME}:bar2-1"